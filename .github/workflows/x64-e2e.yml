name: x64 ecosystem E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Run full x64 ecosystem validation
        shell: pwsh
        run: ./test.ps1 -RunId ci-x64 -Runs 2 -Warmups 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: x64-e2e-evidence
          path: |
            out/ci-x64
            out/ci-x64-arm64-artifacts
          if-no-files-found: warn
